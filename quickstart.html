<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkthrough — Nulltrack</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <!--
      Redirect target for the in-app "Watch the Walkthrough" buttons.
      The app links to nulltrack.app/quickstart instead of YouTube directly,
      so a re-uploaded video only requires editing the URL below — every
      shipped app follows without an app update.
    -->
    <meta http-equiv="refresh" content="0; url=https://youtu.be/E_WQ7Xw_nI4">
    <script>window.location.replace("https://youtu.be/E_WQ7Xw_nI4");</script>
    <style>
        :root {
            --bg:#0E0D0B; --ink:#E8DCC8; --ink-sec:#B0A490; --accent:#DDA343;
        }
        html, body { margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--ink); font-family: ui-monospace, 'SF Mono', Menlo, monospace; line-height: 1.6; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        main { max-width: 720px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; }
    </style>
</head>
<body>
<main>
    <p>Taking you to the Nulltrack walkthrough video&hellip;</p>
    <p>If nothing happens, <a href="https://youtu.be/E_WQ7Xw_nI4">tap here to watch it on YouTube</a>.</p>
</main>
</body>
</html>
